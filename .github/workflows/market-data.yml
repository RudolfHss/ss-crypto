name: SS CRYPTO BTC data
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
concurrency:
  group: ss-crypto-btc
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect verified BTC candles with UTC alignment and EMA warmup
        run: python ss_crypto_market_data.py
      - name: Publish BTC dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ss_crypto_btc_ohlcv.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update verified UTC BTC OHLCV'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: btc-ohlcv
          path: ss_crypto_btc_ohlcv.json
          retention-days: 7
