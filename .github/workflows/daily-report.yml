name: SS CRYPTO daily report
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ss_crypto_daily_report.py
      - .github/workflows/daily-report.yml
permissions:
  contents: read
jobs:
  report-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies
        run: python -m pip install 'reportlab>=4,<5' tzdata pypdf
      - name: Generate integrated report test
        run: |
          python -c "import json,os; from pathlib import Path; Path('provenance.json').write_text(json.dumps({'commit': os.environ['GITHUB_SHA']}))"
          python ss_crypto_daily_report.py --input-dir . --output-dir reports --pdf --test-report
      - name: Verify report outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader
          model_path = next(Path('reports').glob('*.json'))
          model = json.loads(model_path.read_text())
          assert len(model['dominance']['values']) == 7
          assert set(model['btc']['metrics']) == {'4H','1D','1W'}
          reader = PdfReader(next(Path('reports').glob('*.pdf')))
          assert len(reader.pages) == 3
          text = '\n'.join(p.extract_text() for p in reader.pages)
          for term in ['BTC.D','ETH.D','USDT.D','USDC.D','TOTAL2','TOTAL3','CoinGecko','TESZTFUTTATÁS']:
              assert term in text, term
          print('Verified: 3 pages, 7 dominance metrics, 3 BTC timeframes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ss-crypto-daily-report-test-${{ github.run_id }}
          path: reports/*
          if-no-files-found: error
          retention-days: 30
